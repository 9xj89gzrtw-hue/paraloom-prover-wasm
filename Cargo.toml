[package]
name = "paraloom-prover-wasm"
version = "0.1.0"
edition = "2021"
description = "Client-side Groth16 withdrawal and transfer prover for the Paraloom wallet (WASM)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Same arkworks 0.4 line as paraloom-core so the circuit compiles identically
# and proofs verify against the same ceremony verifying key.
ark-std = "0.4"
ark-ff = "0.4"
ark-ec = "0.4"
ark-serialize = "0.4"
ark-bn254 = "0.4"
ark-groth16 = "0.4"
# FFT domains for the snarkjs-compatible reduction the ceremony key needs.
ark-poly = "0.4"
ark-snark = "0.4"
ark-relations = "0.4"
ark-r1cs-std = "0.4"
ark-crypto-primitives = { version = "0.4", features = ["r1cs", "sponge"] }
# Circom-compatible Poseidon for circuit v3 — 0.2.0 is the ark-0.4 line,
# matching paraloom-core.
light-poseidon = "0.2.0"

wasm-bindgen = "0.2"
# Force the JS backend so arkworks' rng works in the browser.
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4"
# `privacy::error`, pulled in by the shared proof-suite codec.
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ext_data_hash = sha256(recipient || amount), matching the on-chain derivation.
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true

[dev-dependencies]
# paraloom-core's test modules come along with the by-path includes and
# need this; the wasm build itself does not.
rand = "0.8"
